<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 891 1260" version="1.1">
  <title>F4 挂历兜底模板 v1 - 24 节气共用骨架 (A3 壁挂)</title>
  <desc>zprintpro 2027 挂历兜底模板, 含 3mm 出血 + 5mm 安全区 + 烫金节气名 + 装订位</desc>

  <!-- 印刷规格: 成品 A3 297×420mm, 设计稿 303×426mm = 909×1279px @ 300DPI -->
  <!-- viewBox 0 0 891 1260 = 297×420mm (1mm = 3px @ 300DPI) -->
  <!-- 顶部装订 10mm = 30px -->

  <!-- 背景: 节气色变量, 默认春绿 #6B8E23 -->
  <rect x="0" y="0" width="891" height="1260" fill="#F5F5DC" />

  <!-- 主体内容区 (避开装订 30px) -->
  <g transform="translate(30, 50)">
    <!-- 节气名 (烫金, 上部 15%) -->
    <g id="solar-term-name">
      <text x="415" y="80" text-anchor="middle" font-family="serif" font-size="72" fill="#D4AF37" font-weight="bold">
        {solar_term}
      </text>
      <text x="415" y="115" text-anchor="middle" font-family="serif" font-size="18" fill="#8B7355" opacity="0.6">
        {pinyin} · {en_name}
      </text>
    </g>

    <!-- 视觉元素区 (中部 60%, 节气插画占位) -->
    <g id="visual-placeholder" transform="translate(415, 500)">
      <rect x="-180" y="-200" width="360" height="400" fill="none" stroke="#8B7355" stroke-width="0.5" stroke-dasharray="4 2" />
      <text text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8B7355" opacity="0.5" y="-5">
        [节气插画占位]
      </text>
      <text text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8B7355" opacity="0.4" y="15">
        S1 水墨线描 + 单点节气色
      </text>
      <text text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8B7355" opacity="0.4" y="30">
        S2 现代扁平 + 几何符号
      </text>
    </g>

    <!-- 习俗/季节描述区 (下部 20%) -->
    <g id="culture-text" transform="translate(415, 950)">
      <text text-anchor="middle" font-family="serif" font-size="16" fill="#8B7355" font-style="italic">
        {culture_text}
      </text>
      <text text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8B7355" opacity="0.6" y="30">
        zh-hk: 港式习俗 / ja: 七十二候 / en: 北半球描述
      </text>
    </g>
  </g>

  <!-- 装订位 (顶部 10mm = 30px, 设计师保留) -->
  <g id="binding-zone">
    <rect x="0" y="0" width="891" height="30" fill="none" stroke="#0000FF" stroke-width="0.3" stroke-dasharray="2 2" />
    <text x="5" y="20" font-family="sans-serif" font-size="8" fill="#0000FF">[装订 10mm]</text>
    <!-- 铁圈孔位示例 (5 等分) -->
    <circle cx="180" cy="15" r="3" fill="none" stroke="#0000FF" stroke-width="0.3" stroke-dasharray="1 1" />
    <circle cx="355" cy="15" r="3" fill="none" stroke="#0000FF" stroke-width="0.3" stroke-dasharray="1 1" />
    <circle cx="535" cy="15" r="3" fill="none" stroke="#0000FF" stroke-width="0.3" stroke-dasharray="1 1" />
    <circle cx="710" cy="15" r="3" fill="none" stroke="#0000FF" stroke-width="0.3" stroke-dasharray="1 1" />
  </g>

  <!-- 工艺标注层 -->
  <g id="craft-overlay" opacity="0.3">
    <!-- 烫金区 (节气名) -->
    <rect x="200" y="20" width="500" height="120" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="4 2" />
    <text x="205" y="35" font-family="sans-serif" font-size="7" fill="#D4AF37">[烫金 - 节气名]</text>

    <!-- 节气色专色 (示例) -->
    <rect x="40" y="100" width="100" height="20" fill="none" stroke="#6B8E23" stroke-width="0.4" stroke-dasharray="2 2" />
    <text x="45" y="113" font-family="sans-serif" font-size="6" fill="#6B8E23">[节气色 Pantone 575C]</text>
  </g>

  <!-- 出血线 + 安全线 -->
  <rect x="0" y="0" width="891" height="1260" fill="none" stroke="#FF00FF" stroke-width="0.5" />
  <rect x="14" y="44" width="863" height="1202" fill="none" stroke="#00FFFF" stroke-width="0.3" stroke-dasharray="2 2" />

</svg>
