<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="146mm" viewBox="0 0 649 438" version="1.1">
  <title>F4 台历兜底模板 v1 - 12 月共用骨架 (三角台历)</title>
  <desc>zprintpro 2027 台历兜底模板, 含 3mm 出血 + 5mm 安全区 + 模切镂空 + 装订位</desc>

  <!-- 印刷规格: 成品 216×146mm, 设计稿 222×152mm = 668×459px @ 300DPI, 装订 10mm 左侧 -->
  <!-- viewBox 0 0 649 438 = 216×146mm (1mm = 3px @ 300DPI) -->

  <!-- 背景: 12 月共享米白底 -->
  <rect x="0" y="0" width="649" height="438" fill="#F5E6CC" />

  <!-- 主体内容区 (避开装订 30px) -->
  <g transform="translate(40, 30)">
    <!-- 视觉元素区 (上部 70%, 镂空 + UV) -->
    <g id="visual-placeholder">
      <text text-anchor="middle" font-family="sans-serif" font-size="18" fill="#8B7355" opacity="0.5" x="290" y="120">
        [光影场景占位]
      </text>
      <text text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8B7355" opacity="0.4" x="290" y="145">
        {light_scene}
      </text>
    </g>

    <!-- 日期区 (底部 20%, 代码生成) -->
    <g id="date-grid" transform="translate(0, 290)">
      <rect x="0" y="0" width="569" height="90" fill="#FFFFFF" opacity="0.7" />
      <text x="20" y="20" font-family="sans-serif" font-size="14" fill="#8B7355" font-weight="bold">
        {month} 2027
      </text>
      <text x="20" y="40" font-family="sans-serif" font-size="8" fill="#8B7355" opacity="0.6">
        [日期网格 - 代码生成, 占 7×5 = 35 格]
      </text>
      <text x="20" y="60" font-family="sans-serif" font-size="7" fill="#8B7355" opacity="0.4">
        zh-hk 农历 / ja 月龄 / en 节日 标注
      </text>
    </g>
  </g>

  <!-- 装订位 (左侧 10mm = 30px, 设计师保留) -->
  <g id="binding-zone">
    <rect x="0" y="0" width="30" height="438" fill="none" stroke="#0000FF" stroke-width="0.3" stroke-dasharray="2 2" />
    <text x="5" y="15" font-family="sans-serif" font-size="6" fill="#0000FF">[装订 10mm]</text>
    <!-- 铁圈孔位示例 (中线 7mm + 150mm 处) -->
    <circle cx="15" cy="120" r="3" fill="none" stroke="#0000FF" stroke-width="0.3" stroke-dasharray="1 1" />
    <circle cx="15" cy="320" r="3" fill="none" stroke="#0000FF" stroke-width="0.3" stroke-dasharray="1 1" />
  </g>

  <!-- 工艺标注层 -->
  <g id="craft-overlay" opacity="0.3">
    <!-- 模切镂空区 (上部视觉元素, 设计师细化) -->
    <path d="M 100 80 L 480 80 L 480 270 L 100 270 Z" fill="none" stroke="#D4380D" stroke-width="0.5" stroke-dasharray="4 2" />
    <text x="105" y="90" font-family="sans-serif" font-size="6" fill="#D4380D">[模切镂空 - 光影造型]</text>

    <!-- UV 区 (光影高光) -->
    <ellipse cx="290" cy="170" rx="80" ry="40" fill="none" stroke="#D4AF37" stroke-width="0.4" stroke-dasharray="3 2" />
    <text x="220" y="220" font-family="sans-serif" font-size="6" fill="#D4AF37">[UV - 光斑]</text>
  </g>

  <!-- 出血线 + 安全线 -->
  <rect x="0" y="0" width="649" height="438" fill="none" stroke="#FF00FF" stroke-width="0.5" />
  <rect x="14" y="14" width="621" height="410" fill="none" stroke="#00FFFF" stroke-width="0.3" stroke-dasharray="2 2" />

</svg>
