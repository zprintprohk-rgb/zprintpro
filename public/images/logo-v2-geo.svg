<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none">
  <defs>
    <linearGradient id="gr1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2873F5"/>
      <stop offset="100%" stop-color="#6DB3FF"/>
    </linearGradient>
  </defs>
  <!-- Geometric Z + print ring -->
  <g transform="translate(30,22)">
    <rect x="0" y="0" width="100" height="6" rx="3" fill="url(#gr1)"/>
    <polygon points="100,0 60,94 0,94 40,0" fill="url(#gr1)"/>
    <rect x="0" y="94" width="100" height="6" rx="3" fill="url(#gr1)"/>
    <circle cx="70" cy="47" r="26" fill="none" stroke="url(#gr1)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
  </g>
  <text x="205" y="98" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="38" fill="#1a1a2e" letter-spacing="2">ZPrintPro</text>
  <text x="205" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#666" letter-spacing="6">智 印 雲</text>
